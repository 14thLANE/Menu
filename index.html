  <style>
    :root {
      --primary-navy: #102235;
      --navy-dark: #0a1724;
      --accent-gold: #c59b27;
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      line-height: 1.4;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: #ffffff;
      min-height: 100vh;
      padding-bottom: 80px;
      box-shadow: 0 0 25px rgba(0,0,0,0.06);
      position: relative;
      overflow: hidden;
    }

    /* Antet cu Logo oficial 14th LANE centrat */
    .top-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 22px 18px 16px;
      border-bottom: 1px solid var(--border-color);
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand-svg {
      width: 190px;
      height: auto;
      display: block;
    }

    /* Căutare rapidă */
    .search-container {
      padding: 14px 18px 10px;
      background: #ffffff;
    }

    .search-input {
      width: 100%;
      border: 1px solid var(--border-color);
      background: #f1f5f9;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary-navy);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(16, 34, 53, 0.1);
    }

    /* Categorii - Încadrate 100% în pagină, trec pe rândul următor fără să iasă în lateral */
    .categories-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 18px 16px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      width: 100%;
    }

    .cat-btn {
      flex: 0 1 auto;
      background: #f1f5f9;
      color: var(--primary-navy);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .cat-btn.active {
      background: var(--primary-navy);
      color: #ffffff;
      border-color: var(--primary-navy);
    }

    /* Listă Produse */
    .items-container {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .product-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .product-img-wrapper {
      width: 100%;
      height: 180px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder-badge {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .product-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--primary-navy);
      line-height: 1.35;
    }

    .product-desc {
      font-size: 0.82rem;
      color: #475569;
      line-height: 1.45;
    }

    .product-allergens {
      font-size: 0.74rem;
      color: #b45309;
      background: #fffbeb;
      padding: 6px 10px;
      border-radius: 4px;
      border-left: 3px solid #f59e0b;
      margin-top: 2px;
    }

    .product-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .meta-tag {
      font-size: 0.7rem;
      font-weight: 600;
      background: #f1f5f9;
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .product-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #f8fafc;
    }

    .price-btn {
      background: var(--primary-navy);
      color: #ffffff;
      border-radius: 4px;
      padding: 8px 14px;
      font-size: 0.95rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .price-btn.no-price {
      background: #475569;
      font-size: 0.8rem;
      font-weight: 600;
    }
  </style>
</head>

    let currentCategory = "Toate";
    let searchQuery = "";

    const categoriesContainer = document.getElementById("categoriesContainer");
    const menuList = document.getElementById("menuList");
    const searchInput = document.getElementById("searchInput");

    const categories = [
      "Toate",
      "Starters",
      "Main Course",
      "Sides",
      "Cafea & Ceai",
      "Răcoritoare",
      "Cocktails",
      "Bere & Cidru",
      "Spirtoase & Shots",
      "Vinuri Locale",
      "Vinuri Import"
    ];

    function renderCategories() {
      categoriesContainer.innerHTML = categories.map(cat => `
        <button class="cat-btn ${cat === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">
          ${cat}
        </button>
      `).join("");
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategories();
      renderMenu();
    }

    function renderMenu() {
      const filtered = menuData.filter(item => {
        const matchesCat = currentCategory === "Toate" || item.category === currentCategory;
        const matchesQuery = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                             item.desc.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesQuery;
      });

      if (filtered.length === 0) {
        menuList.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 50px 0; font-size: 0.9rem;">Nu a fost găsit niciun preparat sau băutură.</div>`;
        return;
      }

      menuList.innerHTML = filtered.map(item => `
        <div class="product-card">
          <div class="product-img-wrapper">
            ${item.img 
              ? `<img src="${item.img}" alt="${item.name}" loading="lazy">` 
              : `<span class="placeholder-badge">Foto preparat</span>`
            }
          </div>
          <div class="product-body">
            <h3 class="product-title">${item.name}</h3>
            <p class="product-desc">${item.desc}</p>
            ${item.allergens ? `<div class="product-allergens">⚠️ Alergeni: ${item.allergens}</div>` : ''}
            <div class="product-meta">
              ${item.weight ? `<span class="meta-tag">${item.weight}</span>` : ''}
              ${item.kcal ? `<span class="meta-tag">${item.kcal}</span>` : ''}
              <span class="meta-tag">${item.category}</span>
            </div>
            <div class="product-footer">
              ${item.price 
                ? `<div class="price-btn">${item.price} lei</div>` 
                : `<div class="price-btn no-price">Preț la cerere</div>`
              }
            </div>
          </div>
        </div>
      `).join("");
    }

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderMenu();
    });

    renderCategories();
    renderMenu();
