  <style>
    :root {
      --primary-navy: #102235;
      --navy-dark: #0a1724;
      --accent-gold: #c59b27;
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      line-height: 1.4;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: #ffffff;
      min-height: 100vh;
      padding-bottom: 40px;
      box-shadow: 0 0 25px rgba(0,0,0,0.06);
      position: relative;
      overflow: hidden;
    }

    /* Antet cu Logo si Comutator RO/EN cu Steaguri */
    .top-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 18px 14px;
      border-bottom: 1px solid var(--border-color);
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 50;
      gap: 10px;
    }

    .header-actions {
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }

    .lang-switcher {
      display: inline-flex;
      background: #f1f5f9;
      border-radius: 20px;
      padding: 3px;
      border: 1px solid var(--border-color);
      gap: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      border-radius: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .flag-icon {
      width: 17px;
      height: 12px;
      border-radius: 2px;
      overflow: hidden;
      display: inline-block;
      box-shadow: 0 0 1px rgba(0,0,0,0.3);
      vertical-align: middle;
    }

    .lang-btn.active {
      background: var(--primary-navy);
      color: #ffffff;
    }

    .brand-svg {
      width: 180px;
      height: auto;
      display: block;
    }

    /* Cautare */
    .search-container {
      padding: 14px 18px 10px;
      background: #ffffff;
    }

    .search-input {
      width: 100%;
      border: 1px solid var(--border-color);
      background: #f1f5f9;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary-navy);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(16, 34, 53, 0.1);
    }

    /* Categorii */
    .categories-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 18px 16px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      width: 100%;
    }

    .cat-btn {
      flex: 0 1 auto;
      background: #f1f5f9;
      color: var(--primary-navy);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .cat-btn.active {
      background: var(--primary-navy);
      color: #ffffff;
      border-color: var(--primary-navy);
    }

    /* Produse */
    .items-container {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .product-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .product-img-wrapper {
      width: 100%;
      height: 200px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder-badge {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .product-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product-header-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .product-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--primary-navy);
      line-height: 1.35;
    }

    /* Badges */
    .diet-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .diet-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 4px;
      letter-spacing: 0.2px;
    }

    .badge-vegetarian {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .badge-gluten-free {
      background: #fefce8;
      color: #b45309;
      border: 1px solid #fde68a;
    }

    .badge-fish {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .product-desc {
      font-size: 0.82rem;
      color: #475569;
      line-height: 1.45;
    }

    .product-allergens {
      font-size: 0.74rem;
      color: #b45309;
      background: #fffbeb;
      padding: 6px 10px;
      border-radius: 4px;
      border-left: 3px solid #f59e0b;
      margin-top: 2px;
    }

    .product-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .meta-tag {
      font-size: 0.7rem;
      font-weight: 600;
      background: #f1f5f9;
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .product-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #f8fafc;
    }

    .price-btn {
      background: var(--primary-navy);
      color: #ffffff;
      border-radius: 4px;
      padding: 8px 14px;
      font-size: 0.95rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .price-btn.no-price {
      background: #475569;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .menu-disclaimer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-style: italic;
      padding: 24px 18px 10px;
    }
  </style>
</head>

    const categoriesContainer = document.getElementById("categoriesContainer");
    const menuList = document.getElementById("menuList");
    const searchInput = document.getElementById("searchInput");
    const disclaimerText = document.getElementById("disclaimerText");
    const btnRo = document.getElementById("btnRo");
    const btnEn = document.getElementById("btnEn");

    function setLanguage(lang) {
      currentLang = lang;
      btnRo.classList.toggle('active', lang === 'ro');
      btnEn.classList.toggle('active', lang === 'en');
      searchInput.placeholder = i18n[lang].searchPlaceholder;
      disclaimerText.textContent = i18n[lang].disclaimer;
      renderCategories();
      renderMenu();
    }

    function renderCategories() {
      const dict = i18n[currentLang].categories;
      categoriesContainer.innerHTML = categoryKeys.map(key => `
        <button class="cat-btn ${key === currentCategoryKey ? 'active' : ''}" onclick="selectCategoryKey('${key}')">
          ${dict[key]}
        </button>
      `).join("");
    }

    function selectCategoryKey(key) {
      currentCategoryKey = key;
      renderCategories();
      renderMenu();
    }

    function renderMenu() {
      const dict = i18n[currentLang];
      const q = searchQuery.toLowerCase().trim();

      const filtered = menuData.filter(item => {
        const matchesCat = (currentCategoryKey === "all") || (item.catKey === currentCategoryKey);
        const loc = item[currentLang];
        const matchesQuery = !q || loc.name.toLowerCase().includes(q) || (loc.desc && loc.desc.toLowerCase().includes(q));
        return matchesCat && matchesQuery;
      });

      if (filtered.length === 0) {
        menuList.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 50px 0; font-size: 0.9rem;">${dict.empty}</div>`;
        return;
      }

      menuList.innerHTML = filtered.map(item => {
        const loc = item[currentLang];
        const canHaveImage = foodCategoryKeys.includes(item.catKey);

        let tagsHtml = "";
        if (item.tags && item.tags.length > 0) {
          tagsHtml = `<div class="diet-badges">` + item.tags.map(t => {
            if (t === "veg") return `<span class="diet-badge badge-vegetarian">${dict.tags.veg}</span>`;
            if (t === "gf") return `<span class="diet-badge badge-gluten-free">${dict.tags.gf}</span>`;
            if (t === "fish") return `<span class="diet-badge badge-fish">${dict.tags.fish}</span>`;
            return "";
          }).join("") + `</div>`;
        }

        const categoryName = dict.categories[item.catKey];

        return `
          <div class="product-card">
            ${canHaveImage ? `
              <div class="product-img-wrapper">
                ${item.img 
                  ? `<img src="${encodeURI(item.img)}" alt="${loc.name}" loading="lazy">` 
                  : `<span class="placeholder-badge">${dict.photoPlaceholder}</span>`
                }
              </div>
            ` : ''}
            <div class="product-body">
              <div class="product-header-row">
                <h3 class="product-title">${loc.name}</h3>
                ${tagsHtml}
              </div>
              <p class="product-desc">${loc.desc}</p>
              ${loc.allergens ? `<div class="product-allergens">${dict.allergensLabel}${loc.allergens}</div>` : ''}
              <div class="product-meta">
                ${item.weight ? `<span class="meta-tag">${item.weight}</span>` : ''}
                ${item.kcal ? `<span class="meta-tag">${item.kcal}</span>` : ''}
                <span class="meta-tag">${categoryName}</span>
              </div>
              <div class="product-footer">
                ${item.price 
                  ? `<div class="price-btn">${item.price}${dict.priceSuffix}</div>` 
                  : `<div class="price-btn no-price">${dict.priceOnRequest}</div>`
                }
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderMenu();
    });

    renderCategories();
    renderMenu();
  </script>
